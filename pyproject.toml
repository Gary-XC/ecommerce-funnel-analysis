[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-funnel-analysis"
version = "0.1.0"
description = "End-to-end e-commerce browse-to-buy funnel analysis with session-level conversion diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = [
    "data-analysis",
    "e-commerce",
    "funnel-analysis",
    "conversion-rate",
    "duckdb",
    "streamlit",
]

dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]
notebooks = ["jupyterlab>=4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
