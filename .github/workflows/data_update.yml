name: Scheduled Pipeline Smoke Test

on:
    schedule:
        # Every Monday at 06:00 UTC.
        # In production, this would trigger a real data refresh on a runner
        # with access to the raw dataset or an approved data warehouse instead of failing the tests
        # since the actual raw dataset are too large to be committed
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    smoke-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Run pipeline unit tests
              run: pytest tests/test_pipeline.py

            - name: Run synthetic pipeline validation
              run: python scripts/validate_pipeline_sample.py
